<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Modelo de página HTML 5 </title>
    <meta name="description" content="Uma página de exemplo para demonstrar
                            a estrutura básica do HTML 5 com Bootstrap e font Awesome.">

    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        header {
            border-color: black;
            border-width: 1px;
            border-style: solid;
            padding-top: 20px;
            padding-bottom:20px;
        }
        main {
            border-color: blue;
            border-width: 1px;
            border-style: dotted;
            padding-top: 20px;
            padding-bottom:20px;
        }
        footer {
            border-color: rgb(104, 104, 255);
            border-width: 1px;
            border-style: dashed;
            padding-top: 20px;
            padding-bottom:20px;
        }
    </style>
</head>
<body>
    <!--Header do site-->
    <header class="container-fluid">

    </header>
    <!--Fim do header do site-->

    <!--Main do site-->
    <main class="container-fluid">
        <section id="section1" class="mb-5"> 
            <h2 class="text-primary"> 
                <i class="fas fa-lightbulb icon"></i>
                seção 1: Font Awesome           
            </h2>

            <article class="card mb-3">
                <div class="card-body">
                    <h3 class="card-title text-warning">
                        <i class="fas fa-pencil-alt icon"></i>
                        Exemplos
                    </h3>
                    <ul>
                        <li><i class="fas fa-info-circle icon"></i></li>
                        <li><i class="fas fa-book icon"></i></li>
                        <li><i class="fas fa-arrow-down icon"></i></li>
                    </ul>
                </div>
            </article>
        </section>
        <section id="section2" class="mb-5"></section>
    </main>
    <!--Fim do main do site-->

    <!--Footer do site-->
    <footer id="footer" class="container text-center">
        <p class="text-muted">
            <i class="far fa-copyright icon"></i>
            2023 - Todos os direitos reservados

        </p>

    </footer>
    <!--Fim do footer do site-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Site vendas</title>
        <meta name="description" content="Uma página de exemplo para demonstrar a estrutura básica do HTML5 com Bootstrap e Font Awesome.">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Font Awesome CSS -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    </head>
    <body class="bg-danger">
        <header class="container-fluid bg-dark p-5">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="text-danger mb-3"><i class="bi bi-shop"></i>  Site de vendas</h1>
                <nav>
                    <ul class="nav">
                        <li class="nav-item"><a href="#quem_somos" class="nav-link text-danger"><i class="fas fa-info-circle icon"></i> Quem somos</a></li>
                        <li class="nav-item"><a href="#produtos" class="nav-link text-danger"><i class="bi bi-list-ul"></i> Produtos</a></li>
                        <li class="nav-item"><a href="#footer" class="nav-link text-danger"><i class="fas fa-arrow-down icon"></i> Rodapé</a></li>
                    </ul>
                </nav>
            </div>
    </header>
    <section>

        <h1 class="title text-dark" style="margin-left: 5px;">Camisas</h1>

        <div id="carouselCamisas" class="carousel slide">
            
            <div class="carousel-inner">
                
                <!--Primeiro slide-->

                <div class="carousel-item active">

                    <div class="container-fluid">
                        <div class="row g-3">

                            <!-- CARD 1 -->
                            <div class="col-auto">
                                <div class="card align-items-center bg-dark"
                                    style="width: 300px; height: 400px; border-radius: 10px;">

                                    <img src="https://placehold.co/100x100?text=Produto\n1"
                                        class="card-img-top"
                                        alt="Camisa Flamengo"
                                        style="width: 250px; padding: 5px; margin-top: 10px; border-radius: 7%;">

                                    <div class="card-body text-center">
                                        <h4 class="card-title text-light">
                                            Produto 1
                                        </h4>

                                        <p class="card-text text-light">
                                            R$ Preço
                                        </p>

                                        <a href="#" class="btn btn-danger">
                                            Comprar
                                        </a>
                                    </div>

                                </div>
                            </div>


                            <!-- CARD 2 -->
                            <div class="col-auto">
                                <div class="card align-items-center bg-dark"
                                    style="width: 300px; height: 400px; border-radius: 10px;">

                                    <img src="https://placehold.co/100x100?text=Produto\n2"
                                        class="card-img-top"
                                        alt="Camisa Flamengo"
                                        style="width: 250px; padding: 5px; margin-top: 10px; border-radius: 7%;">

                                    <div class="card-body text-center">
                                        <h4 class="card-title text-light">
                                            Produto 2
                                        </h4>

                                        <p class="card-text text-light">
                                            R$ Preço
                                        </p>

                                        <a href="#" class="btn btn-danger">
                                            Comprar
                                        </a>
                                    </div>

                                </div>
                            </div>

                            
                            <!-- CARD 3 -->
                            <div class="col-auto">
                                <div class="card align-items-center bg-dark"
                                    style="width: 300px; height: 400px; border-radius: 10px;">

                                    <img src="https://placehold.co/100x100?text=Produto\n3"
                                        class="card-img-top"
                                        alt="Camisa Flamengo"
                                        style="width: 250px; padding: 5px; margin-top: 10px; border-radius: 7%;">

                                    <div class="card-body text-center">
                                        <h4 class="card-title text-light">
                                            Produto 3
                                        </h4>

                                        <p class="card-text text-light">
                                            R$ Preço
                                        </p>

                                        <a href="#" class="btn btn-danger">
                                            Comprar
                                        </a>
                                    </div>

                                </div>
                            </div>


                        </div>
                    </div>

                </div>

                <!--Segundo slide-->
                <div class="carousel-item">

                    <div class="d-flex gap-3">

                        <!--Card 4-->
                        <div class="card align-items-center bg-dark"
                            style="width: 300px; height: 400px; border-radius: 10px;">

                            <img src="https://placehold.co/100x100?text=Produto\n3"
                                class="card-img-top"
                                alt="Camisa Flamengo"
                                style="width: 250px; padding: 5px; margin-top: 10px; border-radius: 7%;">

                            <div class="card-body text-center">
                                <h4 class="card-title text-light">
                                    Produto 3
                                </h4>

                                <p class="card-text text-light">
                                    R$ Preço
                                </p>

                                <a href="#" class="btn btn-danger">
                                    Comprar
                                </a>
                            </div>
                            
                        </div>

                    </div>
                </div>

            </div>

            <!-- SETA ESQUERDA -->
            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#carouselCamisas"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>


            <!-- SETA DIREITA -->
            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#carouselCamisas"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>

    </section>

    </body>
    <footer>
        <div class="container-fluid bg-dark text-center p-5" style="margin-top: 10px;">
            <p class="title text-danger"><i class="bi bi-instagram" style="margin-right: 2px;"></i>Instagram</p>
            <p class="title text-danger"><i class="bi bi-envelope" style="margin-right: 2px;"></i>Email</p>
            <p class="title text-danger"><i class="bi bi-telephone" style="margin-right: 2px;"></i>Telefone</p>
            <p class="title text-danger"><i class="bi bi-geo-alt" style="margin-right: 2px;"></i>Endereço</p>
        </div>
    </footer>
</html>

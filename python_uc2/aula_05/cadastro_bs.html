<body class="bg-secondary">
    <!--
    Div principal    
    Área principal do site contém
        -header
        -main
        -footer
-->
    <div id="div_principal" class="container adicionar_borda bg-light">
        <!--
        header da página
        [-] Logotipo
        [-] Título
        [-] Menu Principal
        [-] Login / Logout / Criar conta

    -->
        <header class="adicionar_borda">
            <div class="row">
                <div class="col 12 m-3">
                    Logo / Título
                </div>
            </div>

            <!--navbar principal-->
            <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Navbar</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                            <li class="nav-item">
                                <a class="nav-link active" href="index.html">
                                    Home
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link active" href="produtos.html">

                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link active" href="blog.html">
                                    Blog
                                </a>
                            </li>

                        </ul>

                        <form class="d-flex">
                            <a class="btn btn-sm btn-success me-1"><i
                                    class="fa-solid fa-arrow-right-to-bracket"></i>Login</a>
                            <a class="btn btn-sm btn-danger me-1"><i class="fa-solid fa-door-open"></i></i>Logout</a>
                            <a href="cadastro_bs.html" target="_blank" class="btn btn-sm btn-primary me-1"><i
                                    class="fa-solid fa-user-plus"></i></a>

                        </form>
                    </div>
                </div>
            </nav>
        </header>
        <!--
        main da página
    -->
        <main class="adicionar_borda">
            <!--Formulário de cadastro-->
            <form action="cadastro/" method="get" target="_blank">

                <!--Nome Completo-->
                <div class="m-3">
                    <label class="form-label" for="nome">Nome completo:</label>
                    <input class="form-control" type="text" id="nome" name="nome" required
                        placeholder="Informar nome completo" title="Nome completo (obrigatório)">
                </div>

                <!--Email-->
                <div class="m-3">
                    <label class="form-label" for="email">Email:</label>
                    <input class="form-control" type="email" id="email" name="email" required
                        placeholder="exemplo@email.com">
                </div>

                <div class="row m-2">
                    <div class="col-6">
                        <!--Senha-->
                        <label class="form-label" for="senha">Senha:</label><br>
                        <input class="form-control" type="password" id="senha" name="senha" required minlength="6"
                            placeholder="Criar senha" title="Pelo menos 6 caracteres">
                    </div>
                    <div class="col 6">
                        <!--Confirmar senha-->
                        <label class="form-label" for="confirm_senha">Confirmar senha:</label><br>
                        <input class="form-control" type="password" id="confirm_senha" name="senha" required
                            minlength="6" placeholder="Confirmar senha" title="Confirme sua senha">
                    </div>
                </div>
                <!--Data de nascimento/Sexo-->
                <div class="row m-2">
                    <div class="col-6">
                        <!--Data de nascimento-->
                        <label class="form-label" for="nascimento">Data de nascimento:</label><br>
                        <input class="form-control" type="date" id="nascimento" name="nascimento" required
                            maxlength="10" placeholder="xx/xx/xxxx" title="Formato: 00/00/0000">
                    </div>
                    <div class="col 6">
                        <!--Sexo-->
                        <label class="form-label" for="sexo">Sexo:</label><br>
                        <input class="form-control" type="text" id="sexo" name="sexo" required
                            placeholder="Informe seu sexo" title="Masculino, feminino ou prefiro não declarar">
                    </div>
                </div>
                <!--CPF-->
                <div class="m-3">
                    <label form-label for="cpf">CPF:</label>
                    <input class="form-control" type="text" id="cpf" name="cpf" required placeholder="000.000.000-00"
                        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 000.000.000-00">
                </div>
                <!--telefone-->
                <div class="m-3">
                    <label form-label for="telefone">Telefone:</label>
                    <input class="form-control" type="tel" id="telefone" name="telefone" required
                        placeholder="(xx) xxxx-xxxx" pattern="\([0-9]{2}\)\s?[0-9]{4,5}-[0-9]{4}"
                        title="Formato: (00) 0000-0000">
                </div>
                <!--botões-->
                <div class="row m-3">
                    <div class="col-6">
                        <button type="reset" class="form-control btn btn-outline-danger">Limpar:</button>
                    </div>
                    <div class="col-6">
                        <button type="submit" class="form-control btn btn-outline-success">Enviar</button>
                    </div>
                </div>
            </form>
        </main>

                    <a href="https://youtube.com/usuario" class="btn btn-sm btn-outline-danger" target="_blank"

            </div>

        </footer>

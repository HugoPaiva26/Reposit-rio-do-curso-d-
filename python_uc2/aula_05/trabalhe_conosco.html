<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[MUDAR]</title>
    <meta name="description" 
        content="[MUDAR].">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"
        rel="stylesheet" >


    <!-- Estilos personalizados (opcional) -->
    <link rel="stylesheet" href="styles.css">

    <style>
        .adicionar_borda {
            border-width: 1px;
            border-style: solid;
            border-color: black;
        }

    </style>



</head>
<!--Final head-->

<body class="bg-secondary">
<!--
    Div principal    
    Área principal do site contém
        -header
        -main
        -footer
-->
<div id="div_principal" class="container adicionar_borda bg-light">
    <!--
        header da página
        [-] Logotipo
        [-] Título
        [-] Menu Principal
        [-] Login / Logout / Criar conta

    -->
    <header class="adicionar_borda">
        <div class="row">
            <div class="col 12 m-3">
                Logo / Título
            </div>
        </div>

        <!--navbar principal-->
        <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            
                        <li class="nav-item">
                            <a class="nav-link active"
                                href="index.html">  
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active"
                                href="produtos.html">  
                                Loja
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active"
                                href="blog.html">  
                                Blog
                            </a>
                        </li>
                            
                    </ul>

                    <form class="d-flex" >
                        <a class="btn btn-sm btn-success me-1"><i class="fa-solid fa-arrow-right-to-bracket"></i>Login</a>
                        <a class="btn btn-sm btn-danger me-1"><i class="fa-solid fa-door-open"></i></i>Logout</a>
                        <a href="cadastro_bs.html" target="_blank" class="btn btn-sm btn-primary me-1"><i class="fa-solid fa-user-plus"></i></a>

                    </form>
                </div>
            </div>
        </nav>

    </header>
    <!--
        main da página
    -->
    <main class="adicionar_borda">
        <!--Formulário de cadastro-->
        <form action="cadastro/" method="get" target="_blank">
            
            <!--Nome Completo-->
            <div class="m-3">
                <label class="form-label"
                    for="nome">Nome completo:</label>
                <input class="form-control"
                    type="text" id="nome" name="nome"
                    required placeholder="Informar nome completo"
                    title="Nome completo (obrigatório)">
            </div>

            <!--Email-->
            <div class="m-3">
                <label class="form-label"
                    for="email">Email:</label>
                <input class="form-control"
                    type="email" id="email" name="email"
                    required placeholder="exemplo@email.com"> 
            </div>
            <!--Estado-->
            <div class="m-3">
                <label class="form-label" for="estado">Estado:</label>
                <select class="form-select" id="estado" name="estado">
                    <option value="" disabled selected>Selecione um estado</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>

            <!--Currículo-->

            <div class="m-3">
                <label class="form-label" for="arquivo-upload">Envie o seu currículo:</label>
                <input class="form-control" type="file" id="arquivo-upload" name="arquivo-upload">
            </div>

            <!--Botôes-->
            <div class="row m-3">
                <div class="col-6">
                    <button type="reset" class="form-control btn btn-outline-danger">Limpar:</button>
                </div>
                <div class="col-6">
                    <button type="submit" class="form-control btn btn-outline-success">Enviar</button>
                </div>
            </div>
        </form>
    </main>
    <!--
        footer da página
        [-] Menu secundário
        [-] Contato
        [-] Copyright do site
        [-] Redes sociais

    -->
    <footer class="adicionar_borda">
        <div class="row ">
            <div class="col 4 m-3">
                Menu secundário
            </div>
            
            <div class="col 5 text-center m-3">
                Contrato <br>
                Copyright
            </div>

            <!--Redes sociais Instagram, Facebook, Github, Youtube-->
            <div class="col 3 m-3 text-end">
                <small>Redes sociais:</small><br>
                <a href="https://instagram.com/usuario" class="btn btn-sm btn-outline-info" target="_blank" title="Acesse nosso Instagram">
                    <i class="fa-brands fa-instagram"></i></a>
                <a href="https://facebook.com/usuario" class="btn btn-sm btn-outline-primary" target="_blank" title="Acesse nosso Facebook">
                    <i class="fa-brands fa-facebook"></i></a>
                <a href="https://github.com/usuario" class="btn btn-sm btn-outline-dark" target="_blank" title="Acesse nosso GitHub">
                    <i class="fa-brands fa-github"></i></a>
                <a href="https://youtube.com/usuario" class="btn btn-sm btn-outline-danger" target="_blank" title="Acesse nosso Youtube">
                    <i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>

    </footer>


</div>
<!--Final div principal-->

<!--Não apague a tag script-->
<!-- Bootstrap JS e dependências -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">       
</script>
</body>
</html>
